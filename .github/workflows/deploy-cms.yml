name: Deploy CMS to Vercel (cms)

on:
  push:
    branches:
      - cms
    paths:
      - "cms/**"
      - "content/**"
      - ".github/workflows/deploy-cms.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies (CMS)
        working-directory: ./cms
        run: npm install

      - name: Build CMS
        working-directory: ./cms
        run: npm run build

      - name: Deploy CMS to Vercel
        uses: vercel/action@v4
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_CMS_PROJECT_ID }}
          working-directory: ./cms
