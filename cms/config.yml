# CMS di-deploy dari branch 'cms' di Netlify
# CMS commit konten ke branch 'patt' → Vercel auto-deploy frontend dari branch 'patt'
# Semua folder content mengarah ke web-tunakarya/public/content/

backend:
  name: github
  repo: RakaPrasetyaHidayat/web-tunakarya
  branch: patt
  base_url: https://api.netlify.com

# media_folder  = path di repo tempat file upload disimpan
# public_folder = URL path yang ditulis ke dalam file .md (yang dibaca browser)
media_folder: "web-tunakarya/public/uploads"
public_folder: "/uploads"

collections:
  # ============================================
  # COLLECTION: HERO / HOME SECTION
  # ============================================
  - name: "hero"
    label: "Hero / Home Section"
    folder: "web-tunakarya/public/content/hero"
    create: true
    slug: "{{title}}"
    sortable_fields: ['order']
    fields:
      - { label: "Judul", name: "title", widget: "string", default: "Selamat Datang", required: true }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Deskripsi", name: "description", widget: "text", required: true }
      - { label: "Gambar Maskot/Hero", name: "maskot_image", widget: "image", required: false,
          media_folder: "web-tunakarya/public/uploads/hero",
          public_folder: "/uploads/hero" }
      - { label: "Urutan", name: "order", widget: "number", value_type: "int", default: 1, min: 0 }
      - { label: "Aktif", name: "active", widget: "boolean", default: true }

  # ============================================
  # COLLECTION: CTA BUTTONS
  # ============================================
  - name: "cta"
    label: "CTA Buttons / Tombol Aksi"
    folder: "web-tunakarya/public/content/cta"
    create: true
    slug: "{{label}}"
    sortable_fields: ['order']
    fields:
      - { label: "Label Tombol", name: "label", widget: "string", required: true }
      - { label: "Tipe Link", name: "link_type", widget: "select", options: ["internal", "external", "whatsapp"], default: "internal", required: true }
      - { label: "Link Internal/External", name: "link_url", widget: "string", required: false }
      - { label: "Nomor WhatsApp", name: "whatsapp_number", widget: "string", required: false }
      - { label: "Varian Tombol", name: "variant", widget: "select", options: ["primary", "secondary", "outline", "ghost"], default: "primary" }
      - { label: "Urutan Tampilan", name: "order", widget: "number", value_type: "int", default: 0, min: 0 }
      - { label: "Tampilkan", name: "active", widget: "boolean", default: true }

  # ============================================
  # COLLECTION: STRUKTUR ORGANISASI
  # ============================================
  - name: "struktur"
    label: "Struktur Organisasi"
    folder: "web-tunakarya/public/content/struktur"
    create: true
    slug: "{{title}}"
    sortable_fields: ['order', 'title', 'role']
    fields:
      - { label: "Nama Lengkap", name: "title", widget: "string", required: true }
      - { label: "Role/Jabatan", name: "role", widget: "string", required: true }
      - { label: "Foto", name: "image", widget: "image", required: false,
          media_folder: "web-tunakarya/public/uploads/struktur",
          public_folder: "/uploads/struktur" }
      - { label: "Urutan Tampilan", name: "order", widget: "number", value_type: "int", default: 0, min: 0 }
      - { label: "Tampilkan di Website", name: "active", widget: "boolean", default: true }
      - { label: "Bio Singkat", name: "body", widget: "markdown", required: false }

  # ============================================
  # COLLECTION: ANGKATAN / PERIODE
  # ============================================
  - name: "angkatan"
    label: "Angkatan/Periode"
    folder: "web-tunakarya/public/content/angkatan"
    create: true
    slug: "angkatan-{{title}}"
    sortable_fields: ['order', 'title']
    fields:
      - { label: "Nama Angkatan", name: "title", widget: "string", required: true, hint: "Contoh: 50/14, 51/15, 52/16" }
      - { label: "Gambar Background", name: "image", widget: "image", required: false,
          media_folder: "web-tunakarya/public/uploads/angkatan",
          public_folder: "/uploads/angkatan" }
      - { label: "Status", name: "status", widget: "string", required: true, default: "Demisoner" }
      - { label: "Deskripsi Angkatan", name: "description", widget: "text", required: false }
      - { label: "Urutan Tampilan", name: "order", widget: "number", value_type: "int", default: 0, min: 0 }
      - { label: "Tampilkan di Website", name: "active", widget: "boolean", default: true }
      - name: "members"
        label: "Anggota Angkatan"
        widget: "list"
        collapsed: true
        fields:
          - { label: "Nama", name: "nama", widget: "string", required: true }
          - { label: "Bidang/Role", name: "bidang", widget: "string", required: true }
          - { label: "Foto", name: "image", widget: "image", required: false,
              media_folder: "web-tunakarya/public/uploads/anggota",
              public_folder: "/uploads/anggota" }

  # ============================================
  # COLLECTION: PURNA KARYA (ALUMNI)
  # ============================================
  - name: "purna"
    label: "Purna Karya"
    folder: "web-tunakarya/public/content/purna"
    create: true
    slug: "{{title}}-{{angkatan}}"
    sortable_fields: ['order', 'angkatan', 'title']
    view_filters:
      - label: Aktif
        field: active
        pattern: true
    fields:
      - { label: "Nama Alumni", name: "title", widget: "string", required: true }
      - { label: "Angkatan", name: "angkatan", widget: "string", required: true, hint: "Contoh: Angkatan 51" }
      - { label: "Foto Profile", name: "profile", widget: "image", required: false,
          media_folder: "web-tunakarya/public/uploads/purna",
          public_folder: "/uploads/purna" }
      - { label: "Quotes/Testimoni", name: "quotes", widget: "text", required: true }
      - { label: "Urutan Tampilan", name: "order", widget: "number", value_type: "int", default: 0, min: 0 }
      - { label: "Tampilkan di Website", name: "active", widget: "boolean", default: true }
      - { label: "Tahun Lulus", name: "lulus_year", widget: "string", required: false }

  # ============================================
  # COLLECTION: PROGRAM
  # ============================================
  - name: "program"
    label: "Program"
    folder: "web-tunakarya/public/content/program"
    create: true
    slug: "{{title}}"
    sortable_fields: ['order', 'title']
    fields:
      - { label: "Judul Program", name: "title", widget: "string", required: true }
      - { label: "Gambar Utama", name: "image", widget: "image", required: false,
          media_folder: "web-tunakarya/public/uploads/program",
          public_folder: "/uploads/program" }
      - { label: "Deskripsi Singkat", name: "description", widget: "text", required: true }
      - { label: "Konten Lengkap", name: "body", widget: "markdown", required: false }
      - { label: "Urutan Tampilan", name: "order", widget: "number", value_type: "int", default: 0, min: 0 }
      - { label: "Tampilkan di Website", name: "active", widget: "boolean", default: true }
      - { label: "Tanggal Program", name: "date", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false }

  # ============================================
  # COLLECTION: GALERI FOTO
  # ============================================
  - name: "galeri"
    label: "Galeri Foto"
    folder: "web-tunakarya/public/content/galeri"
    create: true
    slug: "{{title}}"
    sortable_fields: ['order', 'title', 'kategori']
    view_filters:
      - label: Aktif
        field: active
        pattern: true
    fields:
      - { label: "Judul Foto", name: "title", widget: "string", required: true }
      - { label: "Foto", name: "image", widget: "image", required: true,
          media_folder: "web-tunakarya/public/uploads/galeri",
          public_folder: "/uploads/galeri" }
      - { label: "Kategori", name: "kategori", widget: "string", required: false, default: "Kegiatan" }
      - { label: "Deskripsi", name: "description", widget: "text", required: false }
      - { label: "Urutan Tampilan", name: "order", widget: "number", value_type: "int", default: 0, min: 0 }
      - { label: "Tampilkan di Website", name: "active", widget: "boolean", default: true }

  # ============================================
  # SETTINGS: GLOBAL SITE SETTINGS
  # ============================================
  - name: "settings"
    label: "Pengaturan Website"
    delete: false
    files:
      - name: "site"
        label: "Pengaturan Umum"
        file: "web-tunakarya/public/content/settings/site.json"
        fields:
          - { label: "Judul Website", name: "site_title", widget: "string", default: "Tunakarya" }
          - { label: "Deskripsi Website", name: "site_description", widget: "text" }
          - { label: "Logo", name: "site_logo", widget: "image", required: false,
              media_folder: "web-tunakarya/public/uploads",
              public_folder: "/uploads" }
          - { label: "Email Kontak", name: "contact_email", widget: "string", required: false }
          - { label: "Link Instagram", name: "instagram_url", widget: "string", required: false }
          - { label: "Link Facebook", name: "facebook_url", widget: "string", required: false }
