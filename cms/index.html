<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tunakarya CMS</title>
  <meta name="description" content="CMS untuk mengelola konten website Tunakarya">
</head>
<body>
  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    if (typeof CMS !== 'undefined') {
      CMS.registerEventListener({
        name: 'prePublish',
        handler: ({ entry }) => {
          console.log('Publishing entry:', entry.get('slug'));
          return entry;
        }
      });

      CMS.registerEventListener({
        name: 'preSave',
        handler: ({ entry }) => {
          console.log('Saving entry:', entry.get('slug'));
          return entry;
        }
      });
    }
  </script>
</body>
</html>
